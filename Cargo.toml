[package]
name = "media-transcriber"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
notify-rust = "4.18.0"
rfd = "0.17.2"
sha2 = "0.11.0"
slint = "1.18.0"
ureq = "3.4.2"
whisper-rs = "0.16.0"

[build-dependencies]
slint-build = "1.18.0"

# Embeds the icon and version info into the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
